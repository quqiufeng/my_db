[package]
name = "opencode_gui"
version = "0.1.0"
edition = "2021"

[lib]
name = "opencode_gui"
crate-type = ["cdylib"]

[dependencies]
egui = "0.34"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "thin"
